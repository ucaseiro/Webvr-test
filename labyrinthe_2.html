<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://rawgit.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- ====== ASSETS ====== -->
      <a-assets>
        <img id="wallTex" src="assets/brick.jpg">
        <a-asset-item id="glbspider2" src="./assets/3Danims/spider_with_animation.glb"></a-asset-item>
        <a-asset-item id="glbspider" src="./assets/3Danims/spider_with_animation.glb"></a-asset-item>
        <a-asset-item id="glbbat" src="./assets/3Danims/bat.glb"></a-asset-item>
        <img id="fog" src="assets/fog.jpg">
        <a-asset-item id="glbsnake" src="./assets/3Danims/snake_attack_animations_multiple.glb"></a-asset-item>
      </a-assets>

      <!-- ====== MIXINS ====== -->
      <!-- murs -->
      <a-mixin id="wallBase" geometry="primitive: plane; width: 2; height: 4" material="src: #wallTex; side: double"></a-mixin>
      <!-- animaux -->
      <a-mixin id="mSnake" animation-mixer gltf-model="#glbsnake"></a-mixin>
      <a-mixin id="mBug" animation-mixer gltf-model="#glbspider" scale="0.3 0.3 0.3"></a-mixin>
      <a-mixin id="mCafard" animation-mixer gltf-model="#glbspider2" scale="0.8 0.8 0.8"></a-mixin>
      <a-mixin id="mBat" animation-mixer gltf-model="#glbbat" scale="0.3 0.3 0.3"></a-mixin>

      <!-- ====== MURS ====== -->
      <a-entity mixin="wallBase" position="-2.5 1 -1" rotation="0 90 0"></a-entity>
      <a-entity mixin="wallBase" position="-2.5 1 1" rotation="0 90 0" geometry="width: 2"></a-entity>
      <a-entity mixin="wallBase" position="-2 1 -2"></a-entity>
      <a-entity mixin="wallBase" position="-1.5 1 0"></a-entity>
      <a-entity mixin="wallBase" position="0.25 1 2" geometry="width: 2.5"></a-entity>
      <a-entity mixin="wallBase" position="-1.5 1 -1.5" rotation="0 90 0" geometry="width: 1"></a-entity>
      <a-entity mixin="wallBase" position="-0.5 1 0" rotation="0 90 0"></a-entity>
      <a-entity mixin="wallBase" position="0.5 1 -2"></a-entity>
      <a-entity mixin="wallBase" position="1.5 1 0" rotation="0 90 0" geometry="width: 4"></a-entity>
      <a-entity mixin="wallBase" position="0.5 1 1.5" rotation="0 90 0" geometry="width: 1"></a-entity>
      <a-entity mixin="wallBase" position="-1 1 1.5" rotation="0 90 0" geometry="width: 1"></a-entity>
      <a-entity mixin="wallBase" position="0 1 -1" geometry="width: 1"></a-entity>
      <a-entity mixin="wallBase" position="-0.5 1 -1.75" rotation="0 90 0" geometry="width: 0.5"></a-entity>
      <a-entity mixin="wallBase" position="-0.75 1 -1.5" geometry="width: 0.5"></a-entity>
      <a-entity mixin="wallBase" position="-1.75 1 2" geometry="width: 1.5"></a-entity>
      <a-entity mixin="wallBase" position="-1.5 1 1" geometry="width: 1"></a-entity>
      <a-entity mixin="wallBase" position="1 1 0" geometry="width: 1"></a-entity>

      <!-- sol -->
      <a-plane position="-0.5 0 0" rotation="-90 0 0" width="4" height="4" src="#wallTex"></a-plane>

      <!-- ====== SERPENTS (debout, face au joueur) ====== -->
      <a-entity mixin="mSnake" position="0.91115 0 -1.37113" scale="0.01 0.01 0.01" rotation="0 -140 0"></a-entity>
      <a-entity mixin="mSnake" position="1 0 0.7" rotation="0 130 0" scale="0.01 0.01 0.01"></a-entity>
      <a-entity mixin="mSnake" position="-1.63 0 -0.67053" rotation="0 29.999999999999996 0" scale="0.01 0.01 0.01"></a-entity>
      <a-entity mixin="mSnake" position="-1.426 0 0.460" rotation="0 0 0" scale="0.01 0.01 0.01"></a-entity>

      <!-- ====== CAFARDS ET BUGS (sol + murs, léger flottement) ====== -->
      <a-entity mixin="mCafard" position="0 0.01 0.5" rotation="0 0 0"></a-entity>
      <a-entity mixin="mCafard" position="1 0.01 -0.5" rotation="0 0 0"></a-entity>
      <a-entity mixin="mCafard" position="-1.5 1.3 1" rotation="-90 0 0"></a-entity>
      <a-entity mixin="mBug" position="-1.81254 0.01 0.4263" rotation="-90 -36.580000000000005 0"></a-entity>
      <a-entity mixin="mBug" position="-0.5 0.01 -1.2" rotation="-90 0 0"></a-entity>
      <a-entity mixin="mBug" position="1.2 0 1.5" rotation="0 170 0"></a-entity>

      <!-- murs (animaux collés aux murs) -->
      <a-entity mixin="mCafard" position="-2 1.75 0.02374" rotation="-90 0 0"></a-entity>
      <a-entity mixin="mBug" position="0 1 -1.99273" rotation="90 -0.11 -24.5"></a-entity>
      <a-entity mixin="mBug" position="-2.46732 1 -1.27805" rotation="-90 270 0"></a-entity>
      <a-entity mixin="mCafard" position="-1.5 0 1.5" rotation="0 0 0"></a-entity>
      <a-entity mixin="mCafard" position="0.5 1.5 -2" rotation="90 0 -2.54"></a-entity>
      <a-entity mixin="mBug" position="-0.48842 1 0.5" rotation="-90 0 -90"></a-entity>

      <!-- ====== BATS (volants dans le ciel) ====== -->
      <a-entity mixin="mBat" position="-1.17999 3.86134 -0.77928" rotation="0 29.999999999999996 0"></a-entity>
      <a-entity mixin="mBat" position="-0.80313 3.52146 1.50156" rotation="0 0 0"></a-entity>
      <a-entity mixin="mBat" position="-1.92846 2.58837 0.52259" rotation="0 75 0"></a-entity>
      <a-entity mixin="mBat" position="0.5 2.2 -0.5" rotation="0 125.00000000000001 0"></a-entity>
      <!-- sky & camera & lumières -->
      <a-sky color="#becbbe" src="#fog"></a-sky>
      <a-camera position="0 1.6 0" wasd-controls="acceleration: 10"></a-camera>
      <a-light color="#b0b0b0" type="ambient" intensity="0.3"></a-light>
      <a-entity light="color: #2c4e27; intensity: 0.3; castShadow: true" position="-0.5 1 1"></a-entity>

    </a-scene>
  </body>
</html>
